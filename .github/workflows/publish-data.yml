name: Publish policy data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: asari194617/taskly-policy
          ref: main
          path: upstream/taskly-policy
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
      - name: Verify source hashes and prepare data
        run: node scripts/prepare-data.mjs upstream/taskly-policy published
      - name: Publish immutable editions, then catalog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required credential: $name" >&2
              exit 1
            fi
          done
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          bucket="s3://taskly-policy-web"
          if aws s3api head-object --bucket taskly-policy-web --key data/catalog.json \
              --endpoint-url "$endpoint" >/dev/null 2>head-error.txt; then
            aws s3 cp "$bucket/data/catalog.json" previous-catalog.json \
              --endpoint-url "$endpoint" --no-progress
            node scripts/check-data-update.mjs previous-catalog.json published/data/catalog.json
          elif ! grep -Eq '404|Not Found|NoSuchKey' head-error.txt; then
            cat head-error.txt >&2
            exit 1
          fi
          aws s3 sync published "$bucket" \
            --endpoint-url "$endpoint" --no-progress --exclude 'data/*' \
            --cache-control 'public,max-age=31536000,immutable' \
            --content-type 'text/markdown; charset=utf-8'
          aws s3 cp published/data/catalog.json "$bucket/data/catalog.json" \
            --endpoint-url "$endpoint" --no-progress \
            --cache-control 'no-store' --content-type 'application/json; charset=utf-8'
      - name: Verify current data without rebuilding the app
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const base = 'https://policies.taskly.iy0306.com';
          const expected = JSON.parse(readFileSync('published/data/catalog.json', 'utf8'));
          const response = await fetch(`${base}/data/catalog.json`, {cache: 'no-store'});
          if (!response.ok) throw Error(`Catalog: HTTP ${response.status}`);
          const actual = await response.json();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw Error('Published catalog mismatch');
          for (const [slug, version] of Object.entries(actual.current)) {
            const markdown = await fetch(`${base}/${slug}/${version}.md`);
            if (!markdown.ok) throw Error(`${slug}: HTTP ${markdown.status}`);
            const hash = createHash('sha256').update(await markdown.arrayBuffer()).digest('hex');
            if (hash !== actual.documents[slug].versions[version].publishedSha256) {
              throw Error(`${slug}: published Markdown mismatch`);
            }
          }
          NODE
