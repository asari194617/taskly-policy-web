name: Production policy monitor

on:
  schedule:
    - cron: "17 0 * * *" # 09:17 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.POLICY_MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
      - name: Check public policy routes and search exclusion
        run: node scripts/probe-live.mjs

  issue:
    if: always() && (needs.probe.result == 'success' || needs.probe.result == 'failure')
    needs: [probe]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # This privileged job does not check out or execute repository code.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const title = 'Production policy site health check failed';
            const issues = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'all', per_page: 100});
            const matching = issues.filter(issue => !issue.pull_request && issue.title === title);
            const existing = matching.find(issue => issue.state === 'open') || matching[0];
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (process.env.PROBE_RESULT === 'failure') {
              if (existing?.state === 'open') return;
              if (existing) {
                await github.rest.issues.update({owner, repo, issue_number: existing.number, state: 'open'});
                await github.rest.issues.createComment({owner, repo,
                  issue_number: existing.number, body: `The production probe failed again: ${run}`});
              } else {
                await github.rest.issues.create({owner, repo, title,
                  body: `The scheduled production probe failed. Check HTML, published Markdown hashes, noindex headers, and 404 behavior.\n\nRun: ${run}`});
              }
            } else if (existing?.state === 'open') {
              await github.rest.issues.createComment({owner, repo,
                issue_number: existing.number, body: `The production probe recovered: ${run}`});
              await github.rest.issues.update({owner, repo,
                issue_number: existing.number, state: 'closed'});
            }
